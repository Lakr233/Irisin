name: Pages

on:
  push:
    branches: [main-4.0]
    paths:
      - Documentation/Site/**
      - Documentation/Manual/**
      - .github/workflows/pages.yml
  release:
    types: [published, edited]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live site: let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh Pages from main-4.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main-4.0

  deploy:
    if: github.event_name != 'release' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-4.0
      - name: Check out the shared depiction updater
        uses: actions/checkout@v4
        with:
          repository: owngoal-dev/owngoal-packages
          ref: 4dab9b352c6b3e94c7b5efa96bd60fa94e69225a
          path: .depiction-tools
          sparse-checkout: scripts/update-depiction-changelogs.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fetch GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .depiction-tools/scripts/update-depiction-changelogs.py --repository "$GITHUB_REPOSITORY" --depiction Documentation/Site/depiction.json
      # The manual is edited as a folder of its own; the site is assembled here, in the runner's workspace only, like the depiction's release notes.
      - name: Copy the manual into the site
        run: |
          cp -R Documentation/Manual Documentation/Site/manual
          rm -f Documentation/Site/manual/assets/_skeleton.html Documentation/Site/manual/assets/shots/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/Site
      - id: deployment
        uses: actions/deploy-pages@v4

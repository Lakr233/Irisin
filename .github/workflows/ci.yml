# Pushes and pull requests: test and measure on the host, and in parallel
# build and package, keeping the packages for thirty days. Nothing is
# published from here: a tag publishes, through `release.yml`, the
# packages of its commit's run, once that run has passed.
name: CI

on:
  push:
    branches:
      - main-4.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels the run of its old one. A push to
# main-4.0 keeps its own run however soon the next one follows, since a tag
# on that commit publishes what the run built.
concurrency:
  group: irisin-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  # Minutes where the build takes the better part of an hour, so a broken
  # test says so long before the packages would. Host only: `swift build`
  # has no flat Products directory and needs no case-sensitive volume.
  test:
    name: Host tests and resolver measurements
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Run host tests
        run: make harness

      - name: Measure resolver performance on generated catalogues
        run: |
          swift build --package-path Packages/AptRepository -c release --product ResolverProbe
          probe_dir="$(swift build --package-path Packages/AptRepository -c release --show-bin-path)"
          python3 Scripts/apt-oracle/benchmark.py --probe "$probe_dir/ResolverProbe"

      - name: Upload resolver measurements
        uses: actions/upload-artifact@v4
        with:
          name: resolver-benchmarks
          path: build/resolver-benchmarks/report.json

  # The device packages link the iOS 27.1 SDK (the Makefile refuses an
  # older one): built with it, the app fills an iPhone Duo's displays and
  # its bars stand on the side. The macos-26 images stop at Xcode 26; the
  # xcode-27 runner has Xcode 27.1, chosen by name below rather than as the
  # newest, which on that image is a 27.2 release candidate.
  build:
    name: Build and verify Debian packages
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/irisin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Compile
        run: make compile CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Package and verify both flavours
        run: make _packages CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      # Both flavours package the one build, and neither strip nor ldid touches
      # LC_UUID, so one set of dSYMs matches every shipped binary.
      - name: Archive dSYMs
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          cd "$DERIVED_DATA/Build/Products/Release-iphoneos"
          zip -qry "$GITHUB_WORKSPACE/build/Packages/Irisin_${version}_dSYMs.zip" *.dSYM

      - name: Upload iPhone packages
        uses: actions/upload-artifact@v4
        with:
          name: irisin-iphoneos-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/*_dSYMs.zip
          if-no-files-found: error
          retention-days: 1

  # Apple TV (Documentation/AppleTV.md): the launchpad, irisind and
  # irisin-install for RootHide on tvOS 17, appletvos-arm64e. Still built
  # with Xcode 26: icli's tvos-iokit-stub.sh retargets the iPhoneOS SDK's
  # IOKit.tbd by its `arm64e-ios` target, and from Xcode 27 that stub also
  # names `arm64e.x1-ios`, which the script refuses. It moves to the xcode-27
  # runner with the icli release that retargets it.
  appletv:
    name: Build and verify the Apple TV package
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/irisin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Package and verify Apple TV
        run: make deb-appletv CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Upload Apple TV package
        uses: actions/upload-artifact@v4
        with:
          name: irisin-appletvos-${{ github.sha }}
          path: build/Packages/*.deb
          if-no-files-found: error
          retention-days: 1

  # One artifact per commit, as `release.yml` downloads it: the three
  # packages, the dSYMs and their checksums.
  packages:
    name: Collect the packages
    needs: [build, appletv]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: irisin-*-${{ github.sha }}
          path: build/Packages
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/Packages
          sha256sum ./*.deb ./*_dSYMs.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: irisin-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/*_dSYMs.zip
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
